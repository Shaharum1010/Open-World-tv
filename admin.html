<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>অ্যাডমিন প্যানেল</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap">
<style>
:root{--bg:#0f1722;--sf:#17212f;--ln:#263447;--tx:#eef2f7;--mu:#8fa0b5;--live:#ff3b47;--ok:#2fbf71}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font:16px/1.5 "Hind Siliguri",system-ui,sans-serif;padding:16px;max-width:720px;margin:auto}
h1{font-size:22px;margin-bottom:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}
input,select{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:8px;color:var(--tx);padding:9px 12px;font:inherit;margin-bottom:8px}
label{font-size:13px;color:var(--mu)}
.row{display:flex;gap:8px}.row>*{flex:1}
button{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.p{background:var(--live);border-color:var(--live);color:#fff;font-weight:600}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}
.it:first-child{border-top:0}
.it img{width:36px;height:36px;object-fit:contain;flex:none}
.it div{flex:1;min-width:0}.it b,.it small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it small{color:var(--mu);font-size:12px}
.off{opacity:.5}
#msg{min-height:22px;color:var(--ok);font-size:14px;margin-bottom:8px}#msg.e{color:var(--live)}
video{width:100%;max-height:220px;background:#000;border-radius:8px;margin-top:8px}
:focus-visible{outline:2px solid var(--live);outline-offset:2px}
</style>
</head>
<body>
<h1>অ্যাডমিন প্যানেল</h1>
<p id="msg"></p>

<form id="login" class="card">
  <label>ইমেইল</label><input id="em" type="email" autocomplete="username" required>
  <label>পাসওয়ার্ড</label><input id="pw" type="password" autocomplete="current-password" required>
  <button class="p">লগইন করুন</button>
</form>

<div id="app" hidden>
  <form id="f" class="card">
    <label>চ্যানেলের নাম</label><input id="name" required>
    <label>লোগো লিংক (ছবির URL)</label><input id="logo" type="url">
    <label>স্ট্রিম লিংক (.m3u8)</label><input id="url" type="url" required>
    <div class="row">
      <div><label>ক্যাটাগরি</label><input id="category" list="cl" placeholder="বেছে নিন বা নতুন লিখুন">
        <datalist id="cl"><option value="লাইভ ইভেন্ট"><option value="বাংলাদেশ"><option value="ভারত"><option value="পাকিস্তান"><option value="খেলা"><option value="খবর"><option value="বিনোদন"><option value="ধর্মীয়"><option value="আন্তর্জাতিক"></datalist></div>
      <div><label>ক্রম নম্বর</label><input id="order" type="number" value="1"></div>
    </div>
    <label>অবস্থা</label>
    <select id="active"><option value="true">চালু</option><option value="false">বন্ধ</option></select>
    <label>খোলার ধরন</label>
    <select id="ext"><option value="false">অ্যাপের প্লেয়ারে চালান</option><option value="true">অফিসিয়াল ওয়েবসাইটে খুলুন</option></select>
    <div class="row">
      <button type="button" id="test">লিংক পরীক্ষা করুন</button>
      <button class="p" id="save">সংরক্ষণ করুন</button>
    </div>
    <video id="tv" controls playsinline hidden></video>
  </form>
  <div class="card" id="list"></div>
  <button id="out">লগআউট</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
// Firebase সেটিংস বসাও
const DB = "https://open-world-tv-70a8c-default-rtdb.firebaseio.com";
const API_KEY = "AIzaSyBMx4Q2y6Q8cnc2UGjdTUMv9Ng3GXmlVfc";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let token = sessionStorage.getItem("t") || "", items = {}, editId = null, hls = null;

function say(t, err) { const m = $("#msg"); m.textContent = t; m.className = err ? "e" : ""; }
function show() { $("#login").hidden = !!token; $("#app").hidden = !token; }

async function api(method, path, body) {
  const r = await fetch(`${DB}/${path}.json?auth=${token}`, { method, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { token = ""; sessionStorage.removeItem("t"); show(); throw new Error("সেশন শেষ, আবার লগইন করুন।"); }
  if (!r.ok) throw new Error("সংরক্ষণ হয়নি, ডাটাবেস রুলস পরীক্ষা করুন।");
  return r.json();
}

async function refresh() {
  try { items = (await api("GET", "channels")) || {}; } catch (e) { return say(e.message, 1); }
  const rows = Object.entries(items).sort((a, b) => (a[1].order || 0) - (b[1].order || 0));
  $("#list").innerHTML = rows.length ? rows.map(([id, c]) =>
    `<div class="it ${c.active === false ? "off" : ""}">
      <img src="${esc(c.logo)}" alt="" onerror="this.style.visibility='hidden'">
      <div><b>${esc(c.name)}</b><small>${esc(c.category)} · ${esc(c.url)}</small></div>
      <button data-a="tog" data-id="${id}">${c.active === false ? "চালু করুন" : "বন্ধ করুন"}</button>
      <button data-a="edit" data-id="${id}">এডিট</button>
      <button data-a="del" data-id="${id}">মুছুন</button>
    </div>`).join("") : "<p>এখনো কোনো চ্যানেল নেই। উপরের ফর্ম দিয়ে যোগ করুন।</p>";
}

$("#login").addEventListener("submit", async e => {
  e.preventDefault(); say("");
  try {
    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API_KEY}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: $("#em").value, password: $("#pw").value, returnSecureToken: true })
    });
    const d = await r.json();
    if (!d.idToken) throw 0;
    token = d.idToken; sessionStorage.setItem("t", token); show(); refresh();
  } catch (x) { say("ইমেইল বা পাসওয়ার্ড ভুল।", 1); }
});

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const c = { name: $("#name").value.trim(), logo: $("#logo").value.trim(), url: $("#url").value.trim(),
    category: $("#category").value.trim(), order: +$("#order").value || 0, active: $("#active").value === "true", ext: $("#ext").value === "true" };
  try {
    if (editId) await api("PUT", "channels/" + editId, c); else await api("POST", "channels", c);
    say(editId ? "আপডেট হয়েছে।" : "চ্যানেল যোগ হয়েছে।");
    editId = null; e.target.reset(); $("#order").value = Object.keys(items).length + 2; $("#tv").hidden = true; refresh();
  } catch (x) { say(x.message, 1); }
});

$("#test").addEventListener("click", () => {
  const u = $("#url").value.trim(), v = $("#tv"); if (!u) return say("আগে স্ট্রিম লিংক দিন।", 1);
  try {
    const x = new URL(u), h = x.hostname.replace("www.", "");
    if (h === "youtu.be" || h.endsWith("youtube.com")) {
      return say("এটি YouTube লিংক। অ্যাপে চ্যানেলটি খুলে দেখুন, ভিডিওটি এম্বেড অনুমতি না দিলে চলবে না।");
    }
  } catch (e) {}
  v.hidden = false; say("পরীক্ষা চলছে…");
  if (hls) hls.destroy();
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls(); hls.loadSource(u); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { say("লিংক ঠিক আছে।"); v.play().catch(() => {}); });
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) say("এই লিংক কাজ করছে না।", 1); });
  } else { v.src = u; v.play().catch(() => say("এই লিংক কাজ করছে না।", 1)); }
});

$("#list").addEventListener("click", async e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const id = b.dataset.id, c = items[id];
  try {
    if (b.dataset.a === "tog") { await api("PATCH", "channels/" + id, { active: c.active === false }); refresh(); }
    if (b.dataset.a === "del" && confirm(`"${c.name}" মুছে ফেলবেন?`)) { await api("DELETE", "channels/" + id); refresh(); }
    if (b.dataset.a === "edit") {
      editId = id;
      for (const k of ["name", "logo", "url", "category", "order"]) $("#" + k).value = c[k] ?? "";
      $("#active").value = String(c.active !== false);
      $("#ext").value = String(!!c.ext);
      say("এডিট করছেন: " + c.name); window.scrollTo({ top: 0, behavior: "smooth" });
    }
  } catch (x) { say(x.message, 1); }
});

$("#out").addEventListener("click", () => { token = ""; sessionStorage.removeItem("t"); show(); });
show(); if (token) refresh();
</script>
</body>
</html>
