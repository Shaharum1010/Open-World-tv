<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1722">
<title>লাইভ টিভি</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap">
<style>
:root{--bg:#0f1722;--sf:#17212f;--ln:#263447;--tx:#eef2f7;--mu:#8fa0b5;--live:#ff3b47}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 "Hind Siliguri",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top)}
.stage{position:relative;aspect-ratio:16/9;background:#000;max-height:46vh;width:100%}
video{width:100%;height:100%;background:#000}
.ph,#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--mu)}
#ov{background:rgba(0,0,0,.82);color:var(--tx);flex-direction:column;gap:10px}
#ov button{background:var(--live);color:#fff;border:0;border-radius:8px;padding:8px 18px;font:inherit;font-weight:600}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px}
.bar b{font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;background:var(--live);flex:none}
#q{width:46%;max-width:220px;background:var(--sf);border:1px solid var(--ln);border-radius:20px;color:var(--tx);padding:6px 14px;font:inherit;font-size:14px}
#cats{display:flex;gap:8px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.chip{flex:none;background:var(--sf);color:var(--mu);border:1px solid var(--ln);border-radius:18px;padding:5px 14px;font:inherit;font-size:14px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:600}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;padding:12px 14px 24px;max-width:900px;margin:auto}
.ch{position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 6px 8px;text-align:center;font-size:13px;cursor:pointer}
.ch img{display:block;width:56px;height:56px;object-fit:contain;margin:0 auto 6px}
.ch span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ch.now{border-color:var(--live)}
.lv{position:absolute;top:5px;left:5px;background:var(--live);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:4px;padding:0 5px}
.fav{position:absolute;top:2px;right:4px;background:none;border:0;color:var(--ln);font-size:18px}
.fav.on{color:#ffc53d}
.empty,#net{padding:24px 14px;text-align:center;color:var(--mu);grid-column:1/-1}
#net{color:var(--live)}
:focus-visible{outline:2px solid var(--live);outline-offset:2px}
</style>
</head>
<body>
<div class="top">
  <div class="stage">
    <video id="v" controls playsinline></video>
    <div class="ph" id="ph">একটি চ্যানেল বেছে নিন</div>
    <div id="ov" hidden><div>চ্যানেলটি এখন চালু নেই।</div><button id="retry">আবার চেষ্টা করুন</button></div>
  </div>
  <div class="bar"><i class="dot"></i><b id="now">লাইভ টিভি</b><input id="q" type="search" placeholder="খুঁজুন"></div>
  <div id="cats"></div>
</div>
<p id="net" hidden>ইন্টারনেট সংযোগ পরীক্ষা করুন, তালিকা লোড হয়নি।</p>
<div id="grid"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
// 1) Firebase Realtime Database URL বসাও (শেষে / দিও না)
const DB = "https://open-world-tv-70a8c-default-rtdb.firebaseio.com";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let all = [], cat = "সব", q = "", cur = null, hls = null, tries = 0;
let favs = [];
try { favs = JSON.parse(localStorage.getItem("favs") || "[]"); } catch (e) {}

async function load() {
  try {
    const r = await fetch(DB + "/channels.json");
    const d = (await r.json()) || {};
    all = Object.entries(d).map(([id, c]) => ({ id, ...c }))
      .filter(c => c.active !== false && c.url)
      .sort((a, b) => (a.order || 0) - (b.order || 0));
    $("#net").hidden = true;
  } catch (e) { $("#net").hidden = false; }
  render();
}

function render() {
  const ORDER = ["লাইভ ইভেন্ট", "বাংলাদেশ", "ভারত", "পাকিস্তান", "খেলা", "খবর", "বিনোদন", "ধর্মীয়", "আন্তর্জাতিক"];
  const found = [...new Set(all.map(c => c.category).filter(Boolean))].sort((a, b) => {
    const i = ORDER.indexOf(a), j = ORDER.indexOf(b); return (i < 0 ? 99 : i) - (j < 0 ? 99 : j);
  });
  const cats = ["সব", "ফেভারিট", ...found];
  $("#cats").innerHTML = cats.map(c => `<button class="chip${c === cat ? " on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  const list = all.filter(c =>
    (cat === "সব" || (cat === "ফেভারিট" ? favs.includes(c.id) : c.category === cat)) &&
    (c.name || "").toLowerCase().includes(q));
  $("#grid").innerHTML = list.length ? list.map(c =>
    `<div class="ch${cur && cur.id === c.id ? " now" : ""}" data-id="${c.id}">
      <img src="${esc(c.logo)}" alt="" onerror="this.style.visibility='hidden'">
      <span>${esc(c.name)}</span>
      ${c.category === "লাইভ ইভেন্ট" ? '<i class="lv">LIVE</i>' : ""}
      <button class="fav${favs.includes(c.id) ? " on" : ""}" data-f="${c.id}" aria-label="ফেভারিট">★</button>
    </div>`).join("") : `<p class="empty">কোনো চ্যানেল পাওয়া যায়নি।</p>`;
}

function fail() { $("#ov").hidden = false; }

function play(c) {
  cur = c; tries = 0;
  $("#ph").hidden = true; $("#ov").hidden = true; $("#now").textContent = c.name;
  const v = $("#v");
  if (hls) { hls.destroy(); hls = null; }
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(c.url); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR && tries++ < 3) hls.startLoad();
      else if (d.type === Hls.ErrorTypes.MEDIA_ERROR && tries++ < 3) hls.recoverMediaError();
      else fail();
    });
  } else {
    v.src = c.url; v.onerror = fail; v.play().catch(() => {});
  }
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

$("#grid").addEventListener("click", e => {
  const f = e.target.closest("[data-f]");
  if (f) {
    const id = f.dataset.f;
    favs = favs.includes(id) ? favs.filter(x => x !== id) : [...favs, id];
    try { localStorage.setItem("favs", JSON.stringify(favs)); } catch (x) {}
    return render();
  }
  const el = e.target.closest("[data-id]");
  if (el) play(all.find(c => c.id === el.dataset.id));
});
$("#cats").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (b) { cat = b.dataset.c; render(); } });
$("#q").addEventListener("input", e => { q = e.target.value.trim().toLowerCase(); render(); });
$("#retry").addEventListener("click", () => cur && play(cur));

load();
setInterval(load, 60000); // অ্যাডমিন লিংক বদলালে ১ মিনিটের মধ্যে আপডেট
</script>
</body>
</html>
